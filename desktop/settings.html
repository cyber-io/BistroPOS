<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'"><title>Restaurant server</title><style>*{box-sizing:border-box}body{margin:0;padding:32px;background:#f7f8fb;color:#20293a;font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}h1{font-size:23px;letter-spacing:-.6px;margin:0 0 10px}p{color:#7f8a9b;line-height:1.7;margin:0 0 25px}label{display:block;font-weight:600;font-size:12px;margin-bottom:8px}input{width:100%;border:1px solid #dfe5f0;background:white;padding:13px;border-radius:7px;font:13px inherit;color:#20293a;outline-color:#4779f5}small{display:block;color:#8a94a6;font-size:11px;line-height:1.7;margin:8px 0 25px}.actions{display:flex;gap:10px;justify-content:flex-end}button{border:1px solid #dfe5f0;background:white;border-radius:7px;color:#20293a;padding:11px 16px;font-size:12px;cursor:pointer}button.primary{background:#4779f5;border-color:#4779f5;color:white}button:disabled{opacity:.5}#status{min-height:32px;margin:13px 0;color:#4779f5;font-size:12px;line-height:1.5}</style></head><body><h1>Connect your restaurant</h1><p>The desktop app and website share one restaurant API. Enter the address supplied by your restaurant administrator.</p><label for="url">Restaurant API server</label><input id="url" type="url" placeholder="https://api.yourrestaurant.com"><small>For this computer, use http://127.0.0.1:5050.<br>For a remote server, use an HTTPS address without /api.</small><div id="status" role="status"></div><div class="actions"><button id="test">Test connection</button><button id="save" class="primary">Save & reconnect</button></div><script src="/desktop-settings.js"></script></body></html>
