# Netlify Configuration for BistroPOS
# Automatically detects frontend build and configures SPA routing

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Optional: If you deploy your .NET backend to Render/Railway/VPS, 
# you can proxy /api directly through Netlify to avoid CORS issues:
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend-api.onrender.com/api/:splat"
#   status = 200
#   force = true

# SPA client-side routing fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets for maximum performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
