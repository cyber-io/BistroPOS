<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#162821" />
    <title>BistroPOS</title>
    <script>
      // Silence React DevTools prompt and Permissions-Policy console noise
      if (typeof window !== 'undefined') {
        window.__REACT_DEVTOOLS_GLOBAL_HOOK__ = {
          isDisabled: true,
          supportsFiber: true,
          inject: function() {},
          onCommitFiberRoot: function() {},
          onCommitFiberUnmount: function() {}
        };

        const _origWarn = console.warn;
        const _origError = console.error;
        const _origInfo = console.info;
        const isNoise = (arg) => {
          if (!arg) return false;
          const s = typeof arg === 'string' ? arg : (arg.message || String(arg));
          return s.includes('Permissions-Policy') ||
                 s.includes('private-state-token') ||
                 s.includes('browsing-topics') ||
                 s.includes('run-ad-auction') ||
                 s.includes('join-ad-interest-group') ||
                 s.includes('React DevTools');
        };

        console.info = function (...args) {
          if (args.some(isNoise)) return;
          _origInfo.apply(console, args);
        };
        console.warn = function (...args) {
          if (args.some(isNoise)) return;
          _origWarn.apply(console, args);
        };
        console.error = function (...args) {
          if (args.some(isNoise)) return;
          _origError.apply(console, args);
        };
      }
    </script>
    <!-- Google Fonts for Bistro & Bloom editorial serif and refined modern sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#FAF9F4] text-[#162821] antialiased selection:bg-[#162821] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
